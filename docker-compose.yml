services:
  postgres:
    image: postgres:16
    container_name: inventra-db

    environment:
      POSTGRES_DB: inventra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: inventra-backend

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: inventra-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
